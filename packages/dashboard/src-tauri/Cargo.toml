[package]
name = "magic-context-dashboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "magic_context_dashboard_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-updater",
]
webserver = []
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[[bin]]
name = "magic-context-dashboard"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "webserver"
path = "src/bin/webserver.rs"
required-features = ["webserver"]

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"], optional = true }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
notify = { version = "6", features = ["macos_fsevent"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
regex = "1"
lazy_static = "1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "process", "time", "rt-multi-thread", "net"] }
reqwest = { version = "0.12", features = ["json"] }
md5 = "0.7"
rand = { version = "0.8", features = ["std", "std_rng"] }
wait-timeout = "0.2"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
image = { version = "0.25.6", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
